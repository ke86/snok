name: Daily OneVR Scrape
on:
  # Allow manual trigger from GitHub Actions UI
  # job: 'all' (default) = Kör allt | 'reserv' = Reservdagvy only
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - reserv
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Install Playwright Chromium
        working-directory: scripts
        run: npx playwright install chromium --with-deps
      - name: Run scraper
        working-directory: scripts
        env:
          ONEVR_EMAIL: ${{ secrets.ONEVR_EMAIL }}
          ONEVR_PASSWORD: ${{ secrets.ONEVR_PASSWORD }}
          ONEVR_PIN: ${{ secrets.ONEVR_PIN }}
          ONEVR_JOB: ${{ github.event.inputs.job || 'all' }}
        run: node scrape.js
      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scripts/*.png
          retention-days: 7
